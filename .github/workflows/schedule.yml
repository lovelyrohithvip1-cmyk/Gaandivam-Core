name: Gaandivam Master Run

on:
  schedule:
    # Runs automatically at 3:00 AM UTC every single day
    - cron: '0 3 * * *'
  workflow_dispatch: 

# THIS IS THE UNBEATABLE SHIELD: It forces GitHub to grant write permissions
permissions:
  contents: write

jobs:
  run-factory:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' 

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq requests beautifulsoup4

    - name: Inject Secure Keys
      env:
        GROQ_KEYS: ${{ secrets.GROQ_API_KEYS }}
      run: |
        echo "$GROQ_KEYS" > keys_backup.txt

    - name: Ignite the Master Sequence
      run: python gaandivam_master.py

    - name: Commit and Push Generated Output
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git diff --quiet && git diff --staged --quiet || git commit -m "🤖 Auto-generated daily Gaandivam content"
        git push
